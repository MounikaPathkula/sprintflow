spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sprintflow}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  servlet:
    multipart:
      enabled: false

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-long-random-string-in-production-please-32chars-min}
    expiration-ms: 604800000   # 7 days
  cors:
    allowed-origin: ${CORS_ORIGIN:http://localhost:5173}
